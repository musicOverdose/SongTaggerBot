services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: songtagger-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/data
    tmpfs:
      - /tmp/audio-bot:rw,mode=1777,size=1G
    networks:
      - default
      - telegram-bots
    stop_signal: SIGINT
    stop_grace_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
  telegram-bots:
    external: true
